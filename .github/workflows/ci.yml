name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: SebasCarvajal11/crm-infra/.github/workflows/reusable-ci.yml@main
    with:
      component: frontend
      is_frontend: true
      test_command: pnpm test:unit
    secrets: inherit

  ui:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: Cache motores Playwright
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-browsers-${{ runner.os }}-
      - name: Instalar motores de navegador
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install chromium webkit
          else
            pnpm exec playwright install --with-deps chromium webkit
          fi
      - name: Descargar build compilado
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist
      - name: Verificar marca, presencia, tutorial híbrido y navegación adaptativa
        run: pnpm exec playwright test --config tests/playwright/ui.config.ts --shard=${{ matrix.shard }}/2
      - name: Guardar reporte y capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-browser-report-${{ matrix.shard }}
          path: |
            tests/playwright/reports/ui/
            tests/test-results/ui/
          retention-days: 7
