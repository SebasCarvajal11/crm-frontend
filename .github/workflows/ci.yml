name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: SebasCarvajal11/crm-infra/.github/workflows/reusable-ci.yml@main
    with:
      component: frontend
      is_frontend: true
      test_command: pnpm test:unit
    secrets: inherit

  ui:
    needs: validate
    runs-on: ubuntu-latest
    # Imagen oficial de Playwright: trae Chromium, WebKit y todas sus librerías
    # del sistema preinstaladas para ejecución inmediata y reproducible.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --ipc=host
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: Verificar versión de Playwright de la imagen
        run: |
          esperada="$(node -p "require('@playwright/test/package.json').version")"
          echo "Playwright del proyecto: $esperada (imagen v1.60.0)"
          if [ "$esperada" != "1.60.0" ]; then
            echo "::error::La imagen de Playwright (v1.60.0) no coincide con @playwright/test $esperada. Actualice container.image en ci.yml."
            exit 1
          fi
      - name: Descargar build compilado
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist
      - name: Verificar marca, presencia, tutorial híbrido y navegación adaptativa
        run: pnpm exec playwright test --config tests/playwright/ui.config.ts --shard=${{ matrix.shard }}/2
      - name: Guardar reporte y capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-browser-report-${{ matrix.shard }}
          path: |
            tests/playwright/reports/ui/
            tests/test-results/ui/
          retention-days: 7
