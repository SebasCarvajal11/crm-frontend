name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: SebasCarvajal11/crm-infra/.github/workflows/reusable-ci.yml@v2.5.0
    with:
      component: frontend
      is_frontend: true
      test_command: pnpm test:unit
    secrets: inherit

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: Instalar motores de navegador
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Verificar marca, presencia, tutorial híbrido y navegación adaptativa
        run: pnpm test:ui --shard=${{ matrix.shard }}/3
      - name: Guardar reporte y capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-browser-report-${{ matrix.shard }}
          path: |
            tests/playwright/reports/ui/
            tests/test-results/ui/
          retention-days: 7
